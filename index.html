<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="心と暮らしの困りごとを整理し、自分に合った次の一歩を考えるセルフサポートアプリ（試験利用版）">
<meta name="theme-color" content="#1E4A39">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23F2EEE3' stroke='%231E4A39' stroke-width='2'/%3E%3Cpath d='M16 5 L19.2 16 L12.8 16 Z' fill='%231E4A39'/%3E%3Cpath d='M16 27 L19.2 16 L12.8 16 Z' fill='%231E4A39' opacity='.3'/%3E%3C/svg%3E">
<title>COMPASS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: スマホ1列。上に小さな見出し帯、下に5つのタブ。1画面1問で順番に進む。 */
:root{
  --bg:#F2EEE3;        /* 生成り */
  --surface:#FBF9F3;
  --ink:#1D2924;
  --muted:#5B6860;
  --line:#D8D2C2;
  --green:#1E4A39;     /* 深い緑 */
  --green-soft:#DDE7DF;
  --on-green:#F8F6EF;
  --warm:#9C5A2E;      /* 注意を向けたいところだけ */
  --warm-soft:#F3E3D3;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111915;--surface:#18221D;--ink:#E8E4D8;--muted:#A0ABA3;--line:#2D3A33;
  --green:#8EC0A3;--green-soft:#22362C;--on-green:#0F1E17;--warm:#E2A273;--warm-soft:#3A2A1E;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111915;--surface:#18221D;--ink:#E8E4D8;--muted:#A0ABA3;--line:#2D3A33;
  --green:#8EC0A3;--green-soft:#22362C;--on-green:#0F1E17;--warm:#E2A273;--warm-soft:#3A2A1E;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:30px;height:30px}
.brand b{font-family:var(--display);font-weight:700;letter-spacing:.22em;font-size:1.15rem}
.brand small{display:block;font-size:.7rem;color:var(--muted);letter-spacing:.04em;line-height:1.2}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.85rem;cursor:pointer}

main{display:flex;flex-direction:column;gap:20px;padding-top:20px}
h1{font-family:var(--display);font-weight:700;font-size:1.55rem;line-height:1.4;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0;line-height:1.5;text-wrap:balance}
p{margin:0}
.lead{color:var(--muted);font-size:.95rem}
.eyebrow{font-size:.75rem;letter-spacing:.12em;color:var(--green);font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.block{display:flex;flex-direction:column;gap:10px}
.label{font-weight:700;font-size:.95rem}
.help{font-size:.82rem;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.card.notice{background:var(--warm-soft);border-color:transparent}
.card.notice h2{color:var(--warm)}

.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:.72rem;line-height:1.3;min-width:0}
.scale .dot{border-radius:50%;background:var(--muted);opacity:.35}
.scale button[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);font-weight:700}
.scale button[aria-pressed="true"] .dot{background:var(--green);opacity:1}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.9rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}

.opts{display:grid;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.opt small{color:var(--muted);font-size:.8rem}
.opt[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.opt[aria-pressed="true"] small{color:var(--ink)}

textarea,input[type=text],select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-width:0}
textarea{min-height:88px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--green)}
.range-row{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.big-num{font-family:var(--display);font-size:2rem;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;line-height:1}

.btn{border:0;background:var(--green);color:var(--on-green);border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--green)}
.btn.quiet{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.btn.danger{background:var(--warm);color:var(--on-green)}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

.why{border-left:2px solid var(--green);padding-left:12px;font-size:.88rem;color:var(--muted)}
.why b{color:var(--green);font-size:.78rem;letter-spacing:.06em;display:block}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--green)}

.step-item{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.step-item:first-child{border-top:0;padding-top:0}
.status{display:flex;gap:6px;flex-wrap:wrap}
.status .chip{font-size:.8rem;padding:4px 12px}

.memo{width:100%;min-height:320px;font-size:.88rem;line-height:1.7;white-space:pre-wrap}
.kv{display:grid;grid-template-columns:5.5em 1fr;gap:4px 12px;font-size:.9rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

.chart svg{width:100%;height:auto;display:block}
.day{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.day h3{margin:0;font-size:.95rem}
.empty{color:var(--muted);font-size:.9rem;text-align:center;padding:12px 0}

.fine{font-size:.75rem;color:var(--muted);padding-top:28px;display:flex;flex-direction:column;gap:6px}
.link{background:none;border:0;padding:0;color:var(--green);text-decoration:underline;cursor:pointer;font-size:inherit;text-align:left}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:10px 0 12px;font-size:.78rem;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.tabs button[aria-current="page"]{color:var(--green);font-weight:700}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,20,15,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-body{background:var(--bg);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding-block:20px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.tel{font-family:var(--display);font-size:1.25rem;font-weight:700;color:var(--green);user-select:all;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.88rem;z-index:30;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){main{animation:fade .25s ease}@keyframes fade{from{opacity:.4}to{opacity:1}}}
#printArea{display:none}
@media print{
  body{background:#fff;color:#000}
  .app,.tabs,.sheet,.toast{display:none!important}
  #printArea{display:block;white-space:pre-wrap;font-family:var(--body);font-size:11pt;line-height:1.7;color:#000}
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="var(--green)" stroke-width="1.6"/><path d="M16 5 L19.2 16 L16 27 L12.8 16 Z" fill="var(--green)" opacity=".25"/><path d="M16 5 L19.2 16 L12.8 16 Z" fill="var(--green)"/><circle cx="16" cy="16" r="1.6" fill="var(--bg)"/></svg>
      <div><b>COMPASS</b><small>心と暮らしのセルフサポート</small></div>
    </div>
    <button class="icon-btn" id="openSettings" type="button">設定</button>
  </header>
  <main id="view"></main>
  <footer class="fine">
    <p>COMPASSは、困りごとを自分で整理するための道具です。診断・治療・緊急の相談には対応していません。</p>
    <p>質問と提案は田中亮太（RYOTARO）による確認前の試作案です。</p>
    <p><button class="link" type="button" data-act="openFeedback">試験利用の感想を送る</button>　<button class="link" type="button" data-open-help>今すぐ助けが必要なとき</button></p>
  </footer>
</div>

<nav class="tabs" aria-label="画面の切り替え"><div>
  <button type="button" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>きょう</button>
  <button type="button" data-tab="sort"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h6"/></svg>整理</button>
  <button type="button" data-tab="step"><svg viewBox="0 0 24 24"><path d="M5 19c2-6 5-9 9-11M14 8l-4-1M14 8l1 4"/><circle cx="18" cy="6" r="2"/></svg>一歩</button>
  <button type="button" data-tab="memo"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>メモ</button>
  <button type="button" data-tab="log"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>記録</button>
</div></nav>

<div class="sheet" id="sheet" hidden><div class="sheet-body" id="sheetBody" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<div id="printArea"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey = () => keyOf(new Date());
const fmt = k => { const [y,m,d] = k.split('-').map(Number); return `${m}月${d}日（${'日月火水木金土'[new Date(y,m-1,d).getDay()]}）`; };
const short = k => { const [,m,d] = k.split('-').map(Number); return `${m}/${d}`; };
const uid = () => Math.random().toString(36).slice(2,9);

const MOODS = ['とてもつらい','つらい','ふつう','まあまあ','よい'];
const ENERGY = ['ほとんどない','少し','半分くらい','わりとある','たっぷり'];
const FEELINGS = ['不安','疲れ','いらいら','落ち込み','さみしい','あせり','もやもや','ほっとした','おだやか','うれしい'];
const LOADS = ['体力','気持ち','時間','お金','人間関係','先の見通し'];
const PEOPLE = ['家族','友人','職場の人','学校の先生','かかりつけ医','ケアマネジャー','相談窓口','まだいない'];
const SUPPORTS = ['話を聞いてほしい','情報がほしい','手続きを手伝ってほしい','休む時間がほしい','一緒に考えてほしい','具体的な手助けがほしい'];
const WHO = {self:'自分のこと', family:'家族のこと'};

const THEMES = {
  self:{name:'自分の気持ち', hint:'眠れない、気持ちが沈む、不安が続く など',
    scene:'たとえば「夜ひとりになると、考えが止まらなくなる」',
    small:['温かい飲み物をゆっくり飲む','いまの気持ちを一言だけ書いておく','5分だけ外の空気を吸う'],
    more:['信頼できる人に「最近ちょっと疲れてる」と一言送る','寝る前の30分は画面から離れてみる','気分が重い時間帯を3日分メモする'],
    places:['かかりつけ医','精神保健福祉センター','保健所・保健センター']},
  care:{name:'介護・家族', hint:'介護の負担、家族の変化、認知症の心配 など',
    scene:'たとえば「夕方になると母が落ち着かず、目が離せない」',
    small:['介護で一番大変な場面を一つだけ書き出す','自分のための休憩を10分とる','「よくやっている」と自分に声をかける'],
    more:['地域包括支援センターの連絡先を調べておく','家族に手伝ってほしいことを一つ伝える','ケアマネジャーに聞きたいことをメモする'],
    places:['地域包括支援センター','担当のケアマネジャー','認知症の家族の会など当事者の集まり']},
  work:{name:'仕事・人間関係', hint:'職場の負担、人間関係、働き方の悩み など',
    scene:'たとえば「会議で意見を言うと、上司に否定される」',
    small:['気になったやりとりを「事実」と「気持ち」に分けて書く','帰り道に好きな音楽を一曲聴く','明日いちばん先にやることを一つ決める'],
    more:['話せそうな同僚や上司を一人思い浮かべる','抱えている仕事を書き出して優先順をつける','休みの予定を一日だけ先に入れる'],
    places:['職場の産業医・保健師','総合労働相談コーナー','ハローワーク']},
  kids:{name:'子育て・学校', hint:'子どもの様子、登校、学校とのやりとり など',
    scene:'たとえば「月曜の朝になると、子どもがお腹が痛いと言う」',
    small:['子どもの今日よかったところを一つ書く','学校からの連絡を一か所にまとめる','子どもと5分だけ好きな話をする'],
    more:['担任やスクールカウンセラーに聞きたいことをメモする','子どもの様子を1週間分書きとめる','同じ立場の保護者と話せる場を調べる'],
    places:['担任・養護教諭','スクールカウンセラー','市町村の子育て相談（こども家庭センター等）']},
  life:{name:'暮らし・つながり', hint:'生活の困りごと、お金、孤立感 など',
    scene:'たとえば「休日は誰とも話さずに一日が終わる」',
    small:['部屋の一か所だけ片づける','近所の人にあいさつをする','食事を一回だけきちんととる'],
    more:['市役所の福祉相談窓口を調べる','地域の集まりやサロンの情報を一つ見る','困っている手続きを一つ書き出す'],
    places:['市区町村の福祉相談窓口','社会福祉協議会','民生委員']}
};

/* ---------- 状態と保存 ---------- */
const blank = () => ({settings:{persist:false}, entries:{}, sorts:[], steps:[]});
let S = blank();
try { if (localStorage.getItem('compass-persist') === '1') { const d = JSON.parse(localStorage.getItem('compass-data') || 'null'); if (d) S = Object.assign(blank(), d); S.settings.persist = true; } } catch(e) {}
function save(){ if (!S.settings.persist) return; try { localStorage.setItem('compass-data', JSON.stringify(S)); } catch(e) {} }

const newDraft = () => ({theme:'', who:'self', trouble:'', when:'', where:'', withWhom:'', burden:5, loads:[], tried:'', kept:'', people:[], peopleNote:'', supports:[], supportNote:''});
let draft = newDraft(), qi = 0;
let day = Object.assign({mood:0, feelings:[], energy:0, note:''}, S.entries[todayKey()] || {});
let tab = 'today', stepTheme = '', memoSort = '', memoTo = 'support', showWhy = true;

function toast(t){ const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2400); }
const pressed = b => `aria-pressed="${b ? 'true' : 'false'}"`;
const LINE_URL = 'https://lin.ee/91tbfec';
const newFb = () => ({role:'', used:[], ease:0, flow:'', after:'', words:'', good:'', improve:'', device:''});
let fb = newFb();
const ctx = {draft: () => draft, day: () => day, fb: () => fb};

/* ---------- きょう ---------- */
function vToday(){
  const saved = S.entries[todayKey()];
  const low = day.mood === 1 || (day.mood && day.mood <= 2 && day.energy === 1);
  return `
  <div class="block"><span class="eyebrow">${fmt(todayKey())}</span><h1>いまの状態を、そのまま残す</h1>
  <p class="lead">うまく言葉にできなくても大丈夫です。選ぶだけでも記録になります。</p></div>
  <div class="card">
    <div class="block"><span class="label">気分</span><div class="scale">${MOODS.map((l,i)=>`<button type="button" data-pick="day.mood" data-val="${i+1}" ${pressed(day.mood===i+1)}><span class="dot" style="width:${8+i*3}px;height:${8+i*3}px"></span>${l}</button>`).join('')}</div></div>
    <div class="block"><span class="label">いま近い気持ち <span class="help">いくつでも</span></span><div class="chips">${FEELINGS.map(f=>`<button type="button" class="chip" data-toggle="day.feelings" data-val="${f}" ${pressed(day.feelings.includes(f))}>${f}</button>`).join('')}</div></div>
    <div class="block"><span class="label">余力 <span class="help">今日あと何かをする力</span></span><div class="scale">${ENERGY.map((l,i)=>`<button type="button" data-pick="day.energy" data-val="${i+1}" ${pressed(day.energy===i+1)}><span class="dot" style="width:${8+i*3}px;height:${8+i*3}px"></span>${l}</button>`).join('')}</div></div>
    <div class="block"><label class="label" for="dayNote">ひとこと</label><textarea id="dayNote" data-bind="day.note" placeholder="今日あったこと、気になっていること">${esc(day.note)}</textarea></div>
    <button class="btn" type="button" data-act="saveDay">${saved ? '記録を更新する' : '記録する'}</button>
  </div>
  ${low ? `<div class="card notice"><h2>つらさが強い日ですね</h2><p>今日は何かを頑張るより、休むことを優先してかまいません。つらさが続くときや、自分を傷つけたい気持ちがあるときは、一人で抱えずに誰かに知らせてください。</p><button class="btn ghost" type="button" data-open-help>相談できる先を見る</button></div>` : ''}
  <div class="card"><h2>次にできること</h2>
    <div class="opts">
      <button class="opt" type="button" data-go="sort"><b>困りごとを整理する</b><small>7つの質問に順番に答えます。途中でやめても大丈夫です。</small></button>
      <button class="opt" type="button" data-go="step"><b>今日の一歩を選ぶ</b><small>${day.energy && day.energy<=2 ? '余力が少ない日向けの、小さな一歩から表示します。' : '余力に合わせて、小さな行動を一つ選びます。'}</small></button>
    </div></div>`;
}

/* ---------- 整理（1画面1問） ---------- */
const QUESTIONS = [
  {t:'どのことを整理しますか', why:'テーマを先に決めると、話が広がりすぎず、いま扱うことに集中できます。自分のことか家族のことかも、ここで分けておきます。',
   ok:()=>!!draft.theme,
   r:()=>`<div class="block"><span class="label">テーマ</span><div class="opts">${Object.entries(THEMES).map(([k,t])=>`<button class="opt" type="button" data-pick="draft.theme" data-val="${k}" ${pressed(draft.theme===k)}><b>${t.name}</b><small>${t.hint}</small></button>`).join('')}</div></div>
   <div class="block"><span class="label">誰についての困りごとですか</span><div class="chips">${Object.entries(WHO).map(([k,l])=>`<button type="button" class="chip" data-pick="draft.who" data-val="${k}" ${pressed(draft.who===k)}>${l}</button>`).join('')}</div></div>`},
  {t:'いちばん気になっていることは何ですか', why:'一度にすべてを話さなくて大丈夫です。まず一つに絞ると、次の一歩が見えやすくなります。',
   ok:()=>draft.trouble.trim().length>0,
   r:()=>`<div class="block"><label class="label" for="q-trouble">気になっていること</label><textarea id="q-trouble" data-bind="draft.trouble" placeholder="短くて大丈夫です">${esc(draft.trouble)}</textarea><span class="help">${esc(THEMES[draft.theme]?.hint || '')}</span></div>`},
  {t:'それは、どんな場面で起きますか', why:'「いつ・どこで・誰と」が分かると、気持ちの問題として抱えていたことの中に、環境や段取りで変えられる部分が見えてくることがあります。',
   ok:()=>true,
   r:()=>`<p class="help">${esc(THEMES[draft.theme]?.scene || '')}</p>
   <div class="block"><label class="label" for="q-when">いつ</label><input type="text" id="q-when" data-bind="draft.when" value="${esc(draft.when)}" placeholder="朝、夕方、週末 など"></div>
   <div class="block"><label class="label" for="q-where">どこで</label><input type="text" id="q-where" data-bind="draft.where" value="${esc(draft.where)}" placeholder="家、職場、学校 など"></div>
   <div class="block"><label class="label" for="q-with">誰と</label><input type="text" id="q-with" data-bind="draft.withWhom" value="${esc(draft.withWhom)}" placeholder="ひとりで、家族と など"></div>`},
  {t:'いまの負担は、どのくらいですか', why:'負担の大きさと種類を分けて考えると、必要な手助けの形が具体的になります。体の疲れと気持ちの疲れでは、効く休み方も違います。',
   ok:()=>true,
   r:()=>`<div class="block"><label class="label" for="q-burden">負担の大きさ</label>
   <div class="big-num" id="burdenNum">${draft.burden}<span style="font-size:1rem"> / 10</span></div>
   <input type="range" id="q-burden" min="0" max="10" step="1" value="${draft.burden}" data-bind="draft.burden">
   <div class="range-row"><span>0 ほとんどない</span><span>10 限界に近い</span></div></div>
   <div class="block"><span class="label">どんな負担ですか <span class="help">いくつでも</span></span><div class="chips">${LOADS.map(l=>`<button type="button" class="chip" data-toggle="draft.loads" data-val="${l}" ${pressed(draft.loads.includes(l))}>${l}</button>`).join('')}</div></div>`},
  {t:'これまでに試したこと、続けられていることは？', why:'うまくいかなかった工夫にも、その人の力が表れています。できていることを確かめてから、次の一歩を考えます。',
   ok:()=>true,
   r:()=>`<div class="block"><label class="label" for="q-tried">試してみたこと</label><textarea id="q-tried" data-bind="draft.tried" placeholder="うまくいかなかったことも書いて大丈夫です">${esc(draft.tried)}</textarea></div>
   <div class="block"><label class="label" for="q-kept">大変な中でも続けられていること</label><textarea id="q-kept" data-bind="draft.kept" placeholder="毎日の食事を作っている、仕事に行けている など">${esc(draft.kept)}</textarea></div>`},
  {t:'話せる人や場所はありますか', why:'一人で抱えているのか、誰かとつながっているのかで、次の一歩の選び方が変わります。「まだいない」も大切な情報です。',
   ok:()=>true,
   r:()=>`<div class="block"><span class="label">話せる人・場所 <span class="help">いくつでも</span></span><div class="chips">${PEOPLE.map(p=>`<button type="button" class="chip" data-toggle="draft.people" data-val="${p}" ${pressed(draft.people.includes(p))}>${p}</button>`).join('')}</div></div>
   <div class="block"><label class="label" for="q-pnote">補足</label><input type="text" id="q-pnote" data-bind="draft.peopleNote" value="${esc(draft.peopleNote)}" placeholder="話しやすい人、話しにくい理由 など"></div>
   ${draft.theme ? `<div class="block"><span class="help">このテーマの相談先の例</span><p style="font-size:.9rem">${THEMES[draft.theme].places.join('、')}</p></div>` : ''}`},
  {t:'どんな手助けがあると助かりますか', why:'希望を言葉にしておくと、相談の場で「何をしてほしいか」を伝えやすくなります。話を聞いてほしいだけ、でも立派な希望です。',
   ok:()=>true,
   r:()=>`<div class="block"><span class="label">希望する手助け <span class="help">いくつでも</span></span><div class="chips">${SUPPORTS.map(p=>`<button type="button" class="chip" data-toggle="draft.supports" data-val="${p}" ${pressed(draft.supports.includes(p))}>${p}</button>`).join('')}</div></div>
   <div class="block"><label class="label" for="q-snote">補足</label><input type="text" id="q-snote" data-bind="draft.supportNote" value="${esc(draft.supportNote)}" placeholder="平日の日中に相談したい など"></div>`}
];

function sortSummary(s){
  const scene = [s.when&&`いつ：${s.when}`, s.where&&`どこで：${s.where}`, s.withWhom&&`誰と：${s.withWhom}`].filter(Boolean).join(' ／ ');
  return `<dl class="kv">
    <dt>テーマ</dt><dd>${esc(THEMES[s.theme].name)}（${WHO[s.who]}）</dd>
    <dt>困りごと</dt><dd>${esc(s.trouble)}</dd>
    ${scene?`<dt>場面</dt><dd>${esc(scene)}</dd>`:''}
    <dt>負担</dt><dd>${s.burden} / 10${s.loads.length?`（${s.loads.join('・')}）`:''}</dd>
    ${s.tried?`<dt>試したこと</dt><dd>${esc(s.tried)}</dd>`:''}
    ${s.kept?`<dt>続けていること</dt><dd>${esc(s.kept)}</dd>`:''}
    ${s.people.length||s.peopleNote?`<dt>話せる人</dt><dd>${esc([s.people.join('、'),s.peopleNote].filter(Boolean).join(' ／ '))}</dd>`:''}
    ${s.supports.length||s.supportNote?`<dt>希望</dt><dd>${esc([s.supports.join('、'),s.supportNote].filter(Boolean).join(' ／ '))}</dd>`:''}
  </dl>`;
}

function vSort(){
  if (qi >= QUESTIONS.length) {
    const heavy = draft.burden >= 8 || draft.people.includes('まだいない');
    return `<div class="block"><span class="eyebrow">整理のまとめ</span><h1>ここまで整理できました</h1><p class="lead">言葉にできたこと自体が、一つの前進です。</p></div>
    <div class="card">${sortSummary(draft)}</div>
    ${heavy ? `<div class="card notice"><h2>一人で抱えすぎていませんか</h2><p>${draft.burden>=8?'負担がかなり大きい状態です。':''}${draft.people.includes('まだいない')?'まだ話せる人がいないとのことでした。':''}相談メモを使って、まずは一か所に伝えてみることを考えてみてください。</p><p class="help">相談先の例：${THEMES[draft.theme].places.join('、')}</p></div>` : ''}
    <div class="stack"><button class="btn" type="button" data-act="saveSort">保存して、今日の一歩を選ぶ</button>
    <button class="btn ghost" type="button" data-act="saveSortMemo">保存して、相談メモを作る</button>
    <button class="btn quiet" type="button" data-act="back">戻って直す</button></div>`;
  }
  const q = QUESTIONS[qi];
  return `<div class="block"><span class="eyebrow">質問 ${qi+1} / ${QUESTIONS.length}</span>
    <div class="progress" aria-hidden="true">${QUESTIONS.map((_,i)=>`<i class="${i<=qi?'on':''}"></i>`).join('')}</div>
    <h1>${q.t}</h1></div>
  ${showWhy ? `<div class="why"><b>この質問をする理由</b>${q.why}</div>` : ''}
  <div class="card">${q.r()}</div>
  <div class="row">${qi>0?`<button class="btn quiet" type="button" data-act="back">戻る</button>`:''}<button class="btn" type="button" data-act="next" id="nextBtn" ${q.ok()?'':'disabled style="opacity:.45"'}>${qi===QUESTIONS.length-1?'まとめを見る':'次へ'}</button></div>
  ${qi>1 && !q.ok() ? '' : ''}
  ${qi>=2 ? `<p class="help">この質問は空欄のままでも進めます。</p>` : ''}
  ${S.sorts.length && qi===0 ? `<div class="card"><h2>これまでの整理</h2>${S.sorts.slice(-3).reverse().map(s=>`<div class="day"><h3>${fmt(s.date)}・${THEMES[s.theme].name}</h3><p>${esc(s.trouble)}</p></div>`).join('')}</div>` : ''}`;
}

/* ---------- 一歩 ---------- */
function vStep(){
  const th = stepTheme || S.sorts.at(-1)?.theme || 'self';
  const t = THEMES[th], energy = (S.entries[todayKey()]||day).energy;
  const lowE = energy && energy <= 2;
  const list = lowE ? [['余力が少ない日の一歩', t.small]] : [['小さな一歩', t.small], ['少し余力がある日の一歩', t.more]];
  const todays = S.steps.filter(s => s.date === todayKey());
  return `<div class="block"><span class="eyebrow">今日の一歩</span><h1>できそうなことを、一つだけ</h1>
  <p class="lead">${lowE ? '今日は余力が少なめなので、負担の小さい一歩だけを表示しています。' : '大きな変化より、続けられる小さな行動を選びます。'}</p></div>
  <div class="block"><label class="label" for="stepTheme">テーマ</label><select id="stepTheme" data-act-change="stepTheme">${Object.entries(THEMES).map(([k,v])=>`<option value="${k}" ${k===th?'selected':''}>${v.name}</option>`).join('')}</select></div>
  ${list.map(([h,items])=>`<div class="card"><h2>${h}</h2><div class="opts">${items.map(x=>`<button class="opt" type="button" data-add-step="${esc(x)}" data-theme="${th}">${esc(x)}</button>`).join('')}</div></div>`).join('')}
  <div class="card"><label class="label" for="ownStep">自分で決める</label><input type="text" id="ownStep" placeholder="たとえば「15時にお茶の時間をとる」"><button class="btn ghost" type="button" data-act="ownStep" data-theme="${th}">この一歩を加える</button></div>
  <div class="card"><h2>今日選んだ一歩</h2>
  ${todays.length ? todays.map(s=>`<div class="step-item"><b>${esc(s.text)}</b><span class="help">${THEMES[s.theme].name}</span>
    <div class="status">${[['done','できた'],['some','少しできた'],['skip','今日は見送り']].map(([k,l])=>`<button type="button" class="chip" data-status="${s.id}" data-val="${k}" ${pressed(s.status===k)}>${l}</button>`).join('')}</div>
    ${s.status==='skip'?'<p class="help">見送ると決めたことも、自分の状態に合わせた判断です。</p>':''}</div>`).join('') : '<p class="empty">まだ選んでいません。上の一覧から一つ選んでください。</p>'}</div>`;
}

/* ---------- メモ ---------- */
const TO = {family:['家族・友人へ','いま困っていることを、落ち着いて伝えるためのメモです。'], support:['相談窓口・支援者へ','相談の前に、自分の状況を整理したメモです。'], medical:['医療機関へ','受診のときに伝えたいことをまとめたメモです。']};
function memoText(){
  const s = S.sorts.find(x=>x.id===memoSort) || S.sorts.at(-1);
  const L = [`COMPASS 相談メモ（作成日：${fmt(todayKey())}）`, TO[memoTo][1], ''];
  if (s) {
    L.push(`■ 相談したいこと（${THEMES[s.theme].name}／${WHO[s.who]}）`, s.trouble, '');
    const scene = [s.when&&`いつ：${s.when}`, s.where&&`どこで：${s.where}`, s.withWhom&&`誰と：${s.withWhom}`].filter(Boolean);
    if (scene.length) L.push('■ 困っている場面', scene.join(' ／ '), '');
    L.push('■ 負担の大きさ', `${s.burden} / 10${s.loads.length?`（${s.loads.join('・')}）`:''}`, '');
    if (s.tried) L.push('■ これまでに試したこと', s.tried, '');
    if (s.kept) L.push('■ 続けられていること', s.kept, '');
    if (s.people.length||s.peopleNote) L.push('■ 話せる人・場所', [s.people.join('、'),s.peopleNote].filter(Boolean).join(' ／ '), '');
    if (s.supports.length||s.supportNote) L.push('■ 希望する手助け', [s.supports.join('、'),s.supportNote].filter(Boolean).join(' ／ '), '');
  }
  const days = last7().filter(k=>S.entries[k]);
  if (days.length) { L.push('■ 最近の様子'); days.forEach(k=>{const e=S.entries[k]; L.push(`${short(k)} 気分：${MOODS[e.mood-1]||'—'}／余力：${ENERGY[e.energy-1]||'—'}${e.feelings?.length?`／${e.feelings.join('・')}`:''}${e.note?`／${e.note}`:''}`);}); L.push(''); }
  const st = S.steps.filter(x=>x.status&&x.status!=='skip').slice(-5);
  if (st.length) { L.push('■ 取り組んだ一歩'); st.forEach(x=>L.push(`${short(x.date)} ${x.text}（${x.status==='done'?'できた':'少しできた'}）`)); }
  return L.join('\n').trim();
}
function vMemo(){
  if (!S.sorts.length && !Object.keys(S.entries).length) return `<div class="block"><span class="eyebrow">相談メモ</span><h1>伝えたいことを一枚に</h1><p class="lead">「整理」と「きょう」で記録した内容から、相談のときに見せられるメモを作ります。</p></div>
    <div class="card"><p class="empty">まだ材料がありません。まずは困りごとを整理してみてください。</p><button class="btn" type="button" data-go="sort">困りごとを整理する</button></div>`;
  return `<div class="block"><span class="eyebrow">相談メモ</span><h1>伝えたいことを一枚に</h1><p class="lead">入力した内容だけでまとめています。送信はされません。</p></div>
  <div class="block"><span class="label">渡す相手</span><div class="chips">${Object.entries(TO).map(([k,v])=>`<button type="button" class="chip" data-pick="memoTo" data-val="${k}" ${pressed(memoTo===k)}>${v[0]}</button>`).join('')}</div></div>
  ${S.sorts.length>1?`<div class="block"><label class="label" for="memoSort">使う整理</label><select id="memoSort" data-act-change="memoSort">${S.sorts.slice().reverse().map(s=>`<option value="${s.id}" ${s.id===(memoSort||S.sorts.at(-1).id)?'selected':''}>${fmt(s.date)}・${THEMES[s.theme].name}</option>`).join('')}</select></div>`:''}
  <textarea class="memo" id="memoBox" readonly aria-label="相談メモ">${esc(memoText())}</textarea>
  <button class="btn" type="button" data-act="copyMemo">メモをコピーする</button>
  <div class="row"><button class="btn ghost" type="button" data-act="dlMemo">テキストで保存</button><button class="btn ghost" type="button" data-act="printMemo">印刷・PDF保存</button></div>
  <p class="help">PDFにするときは、印刷画面で「PDFとして保存」を選んでください。</p>`;
}

/* ---------- 記録 ---------- */
function last7(){ const a=[]; for(let i=6;i>=0;i--){const d=new Date(); d.setDate(d.getDate()-i); a.push(keyOf(d));} return a; }
function vLog(){
  const days = last7(), W=320, H=150, top=14, base=112, step=W/7;
  const bars = days.map((k,i)=>{ const e=S.entries[k], x=i*step+step/2;
    const lbl = `<text x="${x}" y="${base+18}" text-anchor="middle" font-size="11" fill="var(--muted)">${short(k)}</text><text x="${x}" y="${base+33}" text-anchor="middle" font-size="10" fill="var(--muted)">${fmt(k).slice(-2,-1)}</text>`;
    if(!e||!e.mood) return `<line x1="${x-10}" x2="${x+10}" y1="${base-1}" y2="${base-1}" stroke="var(--line)" stroke-width="2" stroke-dasharray="3 3"/>${lbl}`;
    const h=(e.mood/5)*(base-top); return `<rect x="${x-12}" y="${base-h}" width="24" height="${h}" rx="5" fill="var(--green)" opacity="${.35+e.mood*.13}"/><text x="${x}" y="${base-h-4}" text-anchor="middle" font-size="10" fill="var(--ink)">${e.mood}</text>${lbl}`; }).join('');
  const keys = Object.keys(S.entries).concat(S.steps.map(s=>s.date), S.sorts.map(s=>s.date));
  const uniq = [...new Set(keys)].sort().reverse();
  return `<div class="block"><span class="eyebrow">記録</span><h1>この7日間の気分</h1><p class="lead">1＝とてもつらい、5＝よい。点線は記録のない日です。</p></div>
  <div class="card chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="直近7日間の気分"><line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)"/>${bars}</svg></div>
  <div class="card"><h2>日付ごとの記録</h2>
  ${uniq.length ? uniq.map(k=>{const e=S.entries[k], st=S.steps.filter(s=>s.date===k), so=S.sorts.filter(s=>s.date===k);
    return `<div class="day"><h3>${fmt(k)}</h3>
    ${e?`<p>気分：${MOODS[e.mood-1]||'—'}／余力：${ENERGY[e.energy-1]||'—'}${e.feelings?.length?`／${esc(e.feelings.join('・'))}`:''}</p>${e.note?`<p class="help">${esc(e.note)}</p>`:''}`:''}
    ${so.map(s=>`<p>整理：${THEMES[s.theme].name}「${esc(s.trouble)}」</p>`).join('')}
    ${st.map(s=>`<p>一歩：${esc(s.text)}${s.status?`（${{done:'できた',some:'少しできた',skip:'見送り'}[s.status]}）`:''}</p>`).join('')}</div>`;}).join('') : '<p class="empty">まだ記録がありません。</p>'}</div>`;
}

/* ---------- 設定・相談先 ---------- */
let confirmDelete = false;
function sheetSettings(){
  return `<div class="row" style="align-items:center"><h1 style="flex:3">設定</h1><button class="icon-btn" type="button" data-act="closeSheet" style="flex:0 0 auto">閉じる</button></div>
  <div class="card"><h2>記録の保存先</h2>
    <div class="opts">
      <button class="opt" type="button" data-persist="0" ${pressed(!S.settings.persist)}><b>このタブを閉じるまで</b><small>標準の設定です。閉じると記録は消えます。</small></button>
      <button class="opt" type="button" data-persist="1" ${pressed(S.settings.persist)}><b>この端末のブラウザに残す</b><small>同じ端末・同じブラウザでだけ見られます。端末間の同期はありません。</small></button>
    </div><p class="help">記録が外部に送信されることはありません。</p></div>
  <div class="card"><h2>表示</h2><button class="opt" type="button" data-act="toggleWhy" ${pressed(showWhy)}><b>質問の理由を表示する</b><small>整理の各質問に、なぜそれを聞くのかを添えます。</small></button></div>
  <div class="card"><h2>試験利用の感想</h2><p class="help">使ってみた感想を、COMPASS公式LINEに送れます。</p><button class="btn ghost" type="button" data-act="openFeedback">感想を書く</button></div>
  <div class="card"><h2>記録をすべて削除</h2><p class="help">削除した記録は元に戻せません。</p>
    ${confirmDelete ? `<p>本当に削除しますか？</p><div class="row"><button class="btn quiet" type="button" data-act="cancelDelete">やめる</button><button class="btn danger" type="button" data-act="doDelete">削除する</button></div>` : `<button class="btn quiet" type="button" data-act="askDelete">削除する</button>`}</div>
  <div class="card"><h2>COMPASSについて</h2>
    <p>心と暮らしの困りごとを整理し、自分に合った次の一歩や、必要な支援とのつながりを考えるためのアプリです。</p>
    <p>制作：田中亮太（RYOTARO）<br><span class="help">精神保健福祉士・社会福祉士・介護福祉士。2005年から精神科医療での相談援助、認知症支援、介護、家族支援、地域活動に携わる。</span></p>
    <p class="help">質問の順番と内容は、相談援助の現場の考え方をもとにした試作案で、本人による確認前のものです。</p></div>`;
}
function sheetHelp(){
  return `<div class="row" style="align-items:center"><h1 style="flex:3">今すぐ助けが必要なとき</h1><button class="icon-btn" type="button" data-act="closeSheet" style="flex:0 0 auto">閉じる</button></div>
  <p class="lead">COMPASSには緊急の相談機能はありません。命の危険があるときや、自分を傷つけてしまいそうなときは、すぐに次の窓口へ連絡してください。</p>
  <div class="card"><div class="block"><span class="label">けがや急な体調の変化、命の危険があるとき</span><span class="tel">119</span></div>
  <div class="block"><span class="label">身の危険を感じるとき（警察）</span><span class="tel">110</span></div></div>
  <div class="card"><div class="block"><span class="label">こころの健康相談統一ダイヤル</span><span class="tel">0570-064-556</span><span class="help">お住まいの都道府県・政令市の相談窓口につながります。受付時間は地域によって異なります。</span></div>
  <div class="block"><span class="label">よりそいホットライン</span><span class="tel">0120-279-338</span><span class="help">暮らしの困りごとや気持ちのつらさを、24時間受け付けています。</span></div></div>
  <p class="help">番号は長押しやドラッグで選択してコピーできます。</p>`;
}
function fbText(){
  const L = ['【COMPASS 試験利用の感想】'];
  const add = (k,v) => { if (v && (!Array.isArray(v) || v.length)) L.push(`■ ${k}：${Array.isArray(v)?v.join('、'):v}`); };
  add('立場', fb.role); add('使った画面', fb.used); add('使いやすさ', fb.ease ? `${fb.ease} / 5` : '');
  add('最後まで進めたか', fb.flow); add('使ったあとの気持ち', fb.after); add('質問の順番や言葉で気になったところ', fb.words);
  add('よかったところ', fb.good); add('直してほしいところ', fb.improve); add('使った端末', fb.device);
  return L.join('\n');
}
function sheetFeedback(){
  const one = (field, items) => `<div class="chips">${items.map(x=>`<button type="button" class="chip" data-pick="fb.${field}" data-val="${x}" ${pressed(fb[field]===x)}>${x}</button>`).join('')}</div>`;
  return `<div class="row" style="align-items:center"><h1 style="flex:3">感想を送る</h1><button class="icon-btn" type="button" data-act="closeSheet" style="flex:0 0 auto">閉じる</button></div>
  <p class="lead">COMPASSは試験利用中です。答えられるところだけで大丈夫です。最後にできた文章をコピーして、COMPASS公式LINEに送ってください。</p>
  <p class="help">きょうの記録や整理した内容は、この感想には含まれません。ご自身の困りごとの内容は書かなくて大丈夫です。</p>
  <div class="card">
    <div class="block"><span class="label">あなたの立場</span>${one('role',['福祉・医療などの仕事をしている','利用者として試した','その他'])}</div>
    <div class="block"><span class="label">使った画面 <span class="help">いくつでも</span></span><div class="chips">${['きょう','整理','一歩','メモ','記録'].map(x=>`<button type="button" class="chip" data-toggle="fb.used" data-val="${x}" ${pressed(fb.used.includes(x))}>${x}</button>`).join('')}</div></div>
    <div class="block"><span class="label">使いやすさ</span><div class="scale">${['使いにくい','やや使いにくい','ふつう','使いやすい','とても使いやすい'].map((l,i)=>`<button type="button" data-pick="fb.ease" data-val="${i+1}" ${pressed(fb.ease===i+1)}><span class="dot" style="width:${8+i*3}px;height:${8+i*3}px"></span>${l}</button>`).join('')}</div></div>
    <div class="block"><span class="label">「整理」を最後まで進められましたか</span>${one('flow',['迷わず進めた','途中で迷った','進められなかった','使っていない'])}</div>
    <div class="block"><span class="label">使ったあとの気持ち</span>${one('after',['少し軽くなった','変わらない','かえって疲れた'])}</div>
  </div>
  <div class="card">
    <div class="block"><label class="label" for="fb-words">質問の順番や言葉で、気になったところ</label><textarea id="fb-words" data-bind="fb.words">${esc(fb.words)}</textarea></div>
    <div class="block"><label class="label" for="fb-good">よかったところ</label><textarea id="fb-good" data-bind="fb.good">${esc(fb.good)}</textarea></div>
    <div class="block"><label class="label" for="fb-improve">直してほしいところ</label><textarea id="fb-improve" data-bind="fb.improve">${esc(fb.improve)}</textarea></div>
    <div class="block"><span class="label">使った端末</span>${one('device',['iPhone','Android','パソコン','その他'])}</div>
  </div>
  <div class="card"><h2>送り方</h2>
    <p>1. 下のボタンで感想の文章をコピーします。</p>
    <button class="btn" type="button" data-act="copyFb">感想をコピーする</button>
    <p>2. COMPASS公式LINEを開いて、トークに貼り付けて送ります。</p>
    <a class="btn ghost" href="${LINE_URL}" target="_blank" rel="noopener" style="text-align:center;text-decoration:none;display:block">COMPASS公式LINEを開く</a>
    <p class="help">開けない場合は、このアドレスをコピーしてブラウザで開いてください：<span style="user-select:all">${LINE_URL}</span></p>
    <textarea id="fbBox" readonly class="memo" style="min-height:140px" aria-label="送る感想の文章">${esc(fbText())}</textarea>
  </div>`;
}
function openSheet(kind){ const body = $('#sheetBody'), y = $('#sheet').hidden ? 0 : body.scrollTop; body.innerHTML = kind==='help' ? sheetHelp() : kind==='feedback' ? sheetFeedback() : sheetSettings(); $('#sheet').hidden = false; $('#sheet').dataset.kind = kind; body.scrollTop = y; }
function closeSheet(){ $('#sheet').hidden = true; confirmDelete = false; }

/* ---------- 描画とイベント ---------- */
const VIEWS = {today:vToday, sort:vSort, step:vStep, memo:vMemo, log:vLog};
function render(scrollTop){ $('#view').innerHTML = VIEWS[tab](); document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-current', b.dataset.tab===tab?'page':'false')); if (scrollTop) window.scrollTo(0,0); }
function go(t){ tab = t; render(true); }
function setPath(path, v){ const [o,k] = path.split('.'); if (!k) { if (o==='memoTo') memoTo = v; return; } ctx[o]()[k] = v; }
function getPath(path){ const [o,k] = path.split('.'); return ctx[o]()[k]; }

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) { if (e.target.id==='sheet') closeSheet(); return; }
  const d = b.dataset;
  if (d.tab) return go(d.tab);
  if (d.go) return go(d.go);
  if ('openHelp' in d) return openSheet('help');
  if (b.id === 'openSettings') return openSheet('settings');
  if (d.pick) { const n = Number(d.val); setPath(d.pick, isNaN(n) ? d.val : n); return rerender(); }
  if (d.toggle) { const arr = getPath(d.toggle), i = arr.indexOf(d.val); i<0 ? arr.push(d.val) : arr.splice(i,1); return rerender(); }
  if (d.addStep) { S.steps.push({id:uid(), date:todayKey(), theme:d.theme, text:d.addStep, status:''}); save(); toast('今日の一歩に加えました'); return render(); }
  if (d.status) { const s = S.steps.find(x=>x.id===d.status); s.status = s.status===d.val ? '' : d.val; save(); return render(); }
  if (d.persist) { S.settings.persist = d.persist==='1';
    try { if (S.settings.persist) { localStorage.setItem('compass-persist','1'); save(); toast('この端末のブラウザに残します'); } else { localStorage.removeItem('compass-persist'); localStorage.removeItem('compass-data'); toast('端末への保存をやめました。記録はこのタブを閉じるまで残ります'); } }
    catch(err) { S.settings.persist = false; toast('このブラウザでは端末に保存できません'); }
    return openSheet('settings'); }
  const a = d.act; if (!a) return;
  if (a==='saveDay') { if (!day.mood && !day.energy && !day.note.trim() && !day.feelings.length) return toast('気分か余力を一つ選んでください');
    S.entries[todayKey()] = {...day, feelings:[...day.feelings]}; save(); toast('記録しました'); return render(); }
  if (a==='next') { if (!QUESTIONS[qi].ok()) return; qi++; return render(true); }
  if (a==='back') { qi = Math.max(0, qi-1); return render(true); }
  if (a==='saveSort' || a==='saveSortMemo') { const s = {...draft, id:uid(), date:todayKey(), loads:[...draft.loads], people:[...draft.people], supports:[...draft.supports]};
    S.sorts.push(s); save(); stepTheme = s.theme; memoSort = s.id; draft = newDraft(); qi = 0; toast('整理を保存しました'); return go(a==='saveSort'?'step':'memo'); }
  if (a==='ownStep') { const v = $('#ownStep').value.trim(); if (!v) return toast('一歩の内容を書いてください'); S.steps.push({id:uid(), date:todayKey(), theme:d.theme, text:v, status:''}); save(); toast('今日の一歩に加えました'); return render(); }
  if (a==='copyMemo') { const box = $('#memoBox'), t = box.value;
    const fallback = () => { box.focus(); box.select(); toast('メモを選択しました。コピーしてください'); };
    try { navigator.clipboard.writeText(t).then(()=>toast('コピーしました'), fallback); } catch(err) { fallback(); } return; }
  if (a==='dlMemo') { const blob = new Blob([memoText()], {type:'text/plain;charset=utf-8'}), u = URL.createObjectURL(blob), l = document.createElement('a');
    l.href = u; l.download = `COMPASS相談メモ_${todayKey()}.txt`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u), 1000); return toast('テキストで保存しました'); }
  if (a==='printMemo') { $('#printArea').textContent = memoText(); window.print(); return; }
  if (a==='closeSheet') return closeSheet();
  if (a==='openFeedback') return openSheet('feedback');
  if (a==='copyFb') { const box = $('#fbBox'), t = fbText();
    const fallback = () => { box.focus(); box.select(); toast('文章を選択しました。コピーしてください'); };
    try { navigator.clipboard.writeText(t).then(()=>toast('コピーしました。公式LINEに貼り付けてください'), fallback); } catch(err) { fallback(); } return; }
  if (a==='toggleWhy') { showWhy = !showWhy; openSheet('settings'); return render(); }
  if (a==='askDelete') { confirmDelete = true; return openSheet('settings'); }
  if (a==='cancelDelete') { confirmDelete = false; return openSheet('settings'); }
  if (a==='doDelete') { const p = S.settings.persist; S = blank(); S.settings.persist = p; day = {mood:0, feelings:[], energy:0, note:''}; draft = newDraft(); qi = 0; save(); confirmDelete = false; closeSheet(); toast('記録をすべて削除しました'); return go('today'); }
});
function rerender(){ if (!$('#sheet').hidden) return openSheet($('#sheet').dataset.kind); const y = window.scrollY; render(); window.scrollTo(0,y); }
document.addEventListener('input', e => {
  const el = e.target, p = el.dataset.bind; if (!p) return;
  setPath(p, el.type==='range' ? Number(el.value) : el.value);
  if (p.startsWith('fb.') && $('#fbBox')) $('#fbBox').value = fbText();
  if (el.id==='q-burden') $('#burdenNum').firstChild.nodeValue = el.value;
  if (tab==='sort') { const btn = $('#nextBtn'), ok = QUESTIONS[qi]?.ok(); if (btn) { btn.disabled = !ok; btn.style.opacity = ok ? '' : '.45'; } }
});
document.addEventListener('change', e => {
  const k = e.target.dataset.actChange; if (!k) return;
  if (k==='stepTheme') { stepTheme = e.target.value; render(); }
  if (k==='memoSort') { memoSort = e.target.value; render(); }
});
document.addEventListener('keydown', e => { if (e.key==='Escape' && !$('#sheet').hidden) closeSheet(); });
render();
</script>
</body>
</html>
